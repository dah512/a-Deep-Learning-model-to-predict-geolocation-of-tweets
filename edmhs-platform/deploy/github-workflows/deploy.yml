# Deploys edmhs.org on every push to main: API -> Cloud Run, site -> Firebase Hosting.
# Copy to .github/workflows/deploy.yml in the edmhs-org repository (it is kept here, outside
# .github/, so it cannot run from the staging repository).
# Needs the repository variables printed by deploy/bootstrap_gcp.sh. No stored keys: auth is
# Workload Identity Federation, restricted to this repository's main branch.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ["ops/reports/**"]   # daily/weekly review commits never redeploy
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: { group: deploy-production, cancel-in-progress: false }
env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/edmhs/edmhs-api:${{ github.sha }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/api/requirements.txt
      - run: PYTHONPATH=gpcs/python pytest -q gpcs/python/tests
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build API image (Cloud Build)
        run: |
          gcloud builds submit . --project "$PROJECT" --region "$REGION" \
            --config deploy/cloudbuild.api.yaml --substitutions "_IMAGE=$IMAGE"
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy edmhs-api --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances "${{ vars.CLOUDSQL_CONNECTION }}" \
            --set-secrets "INTAKE_DATABASE_URL=INTAKE_DATABASE_URL:latest,ANALYTICS_DATABASE_URL=ANALYTICS_DATABASE_URL:latest,PII_KEY=PII_KEY:latest" \
            --set-env-vars "^;^CORS_ORIGINS=https://edmhs.org,https://www.edmhs.org,https://ict.edmhs.org,https://ict.edmhs.us;GPCS_KB=/knowledge_base" \
            --allow-unauthenticated --min-instances 0 --max-instances 3 --memory 512Mi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site
        run: pip install markdown && python site/build.py
      - name: Deploy Firebase Hosting
        run: npx -y firebase-tools@13.29.1 deploy --only hosting --project "$PROJECT" --non-interactive
      - name: Smoke test
        run: |
          SITE="${{ vars.FIREBASE_SITE || 'edmhs-org' }}"
          curl -fsS "https://${SITE}.web.app/" | grep -q "EDMHS"
          curl -fsS "https://${SITE}.web.app/api/health" | grep -q '"ok":true'
