id: pmsg
name: "Pain Management Support Group (PMSG)"
url: "https://pmsg.edmhs.us"
category: training_and_education
summary: >-
  8-week, 32-session non-pharmacologic chronic pain program combining pain neuroscience education,
  CBT, anti-inflammatory nutrition, and movement practice (Qi Gong, Tai Chi), with outcomes tracked by
  the Brief Pain Inventory (BPI-SF) and Oswestry Disability Index (ODI).
