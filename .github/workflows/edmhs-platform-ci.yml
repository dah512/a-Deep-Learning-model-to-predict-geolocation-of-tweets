name: edmhs-platform CI
on:
  push:
    paths: ["edmhs-platform/**", ".github/workflows/edmhs-platform-ci.yml"]
  pull_request:
    paths: ["edmhs-platform/**", ".github/workflows/edmhs-platform-ci.yml"]
defaults:
  run:
    working-directory: edmhs-platform
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/api/requirements.txt
      - run: PYTHONPATH=gpcs/python pytest -q gpcs/python/tests
      - run: pytest -q ops/tests
      - name: DB access tests + API integration tests
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: |
          DB=edmhs db/tests/test_access.sh
          psql -d edmhs -c "CREATE ROLE ict_api LOGIN PASSWORD 'ci' IN ROLE edm_intake; CREATE ROLE ana_api LOGIN PASSWORD 'ci' IN ROLE edm_analyst;"
          cd services/api && INTAKE_DATABASE_URL=postgresql://ict_api:ci@localhost/edmhs ANALYTICS_DATABASE_URL=postgresql://ana_api:ci@localhost/edmhs PII_KEY=ci PYTHONPATH=.:../../gpcs/python pytest -q tests
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: sudo apt-get install -y libpoppler-cpp-dev
      - run: Rscript -e 'install.packages(c("yaml","jsonlite","pdftools","testthat"))'
      - run: cd gpcs/r/tests && Rscript testthat.R
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web/react && npm install && npm run build
      - run: cd web/angular && npm install && npx ng build
      - run: pip install markdown && python site/build.py
